[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yaml2budget"
dynamic = ["version"]
description = "Static HTML viewers for hierarchical performance budgets (CBE vs allocation)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kyle Van Gorkom", email = "kyle.vangorkom@gmail.com" }]
keywords = ["performance budget", "systems engineering", "instrumentation", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.22",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["openpyxl>=3.1", "playwright>=1.40"]   # for the browser-driven Excel export tests
dev = ["yaml2budget[test]", "build", "pycodestyle"]

[project.scripts]
yaml2budget = "yaml2budget.cli:main"

[project.urls]
Homepage = "https://github.com/kvangorkom/yaml2budget"
Documentation = "https://github.com/kvangorkom/yaml2budget/blob/main/docs/usage.md"
Issues = "https://github.com/kvangorkom/yaml2budget/issues"

[tool.hatch.version]
path = "src/yaml2budget/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/yaml2budget"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE"]

[tool.pycodestyle]
max-line-length = 100
